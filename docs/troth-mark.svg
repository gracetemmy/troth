<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Troth">
  <title>Troth</title>
  <rect width="200" height="200" rx="44" fill="#0B1724"/>

  <g fill="#F3F1EB">
    <!-- the beam: a balance arm, tapering to a point at each end -->
    <path d="M14 78 L86 71.5 L86 84.5 Z"/>
    <path d="M186 78 L114 71.5 L114 84.5 Z"/>

    <!-- the plumb line: the stem of the T, falling to a point -->
    <path d="M96.4 48 L103.6 48 L101.4 178 L98.6 178 Z"/>

    <!-- the pivot -->
    <circle cx="100" cy="78" r="13.5"/>
  </g>
  <circle cx="100" cy="78" r="6.5" fill="#0B1724"/>
</svg>
