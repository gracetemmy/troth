[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "troth"
version = "0.1.0"
description = "A sales copilot that remembers what was promised, and refuses to repeat a promise it hasn't verified. Built on Sibyl Memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gracetemmy" }]
keywords = ["sibyl-memory", "agent-memory", "sales", "crm"]

dependencies = [
    "sibyl-memory-client>=0.8.0",
    "starlette>=0.37",
    "uvicorn>=0.27",
    "openpyxl>=3.1",
    # Serverless only. The SQLite compiled into Vercel's Python runtime
    # lacks the FTS5 tokenizer Sibyl's search index needs, so every write
    # failed with "error in tokenizer constructor" while reads worked.
    # Linux-marked, so local installs on macOS/Windows skip it entirely.
    "pysqlite3-binary>=0.5; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
troth = "troth.cli:main"

[project.urls]
Repository = "https://github.com/gracetemmy/troth"

[tool.setuptools]
packages = ["troth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
